services:
  sogi-website:
    image: nginx:1.27-alpine
    container_name: sogi-website
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /mnt/user/appdata/sogi-website/html:/usr/share/nginx/html:ro
      - /mnt/user/appdata/sogi-website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
