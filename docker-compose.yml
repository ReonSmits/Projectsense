services:
  sense-website:
    image: nginx:1.27-alpine
    container_name: sense-website
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      - /mnt/user/appdata/sense-website/html:/usr/share/nginx/html:ro
      - /mnt/user/appdata/sense-website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
